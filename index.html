<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unikiq Dialer</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 800px; background: #1e293b; border-radius: 12px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header h1 { font-size: 20px; margin: 0; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; }
    .seller-badge { background: #334155; padding: 6px 12px; border-radius: 20px; font-size: 14px; }
    
    .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 12px; border: none; background: #334155; color: #94a3b8; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
    .tab-btn.active { background: #38bdf8; color: #0f172a; }

    .sub-tabs { display: flex; gap: 8px; margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 10px; flex-wrap: wrap; }
    .sub-tab-btn { background: transparent; border: 1px solid #475569; color: #94a3b8; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .sub-tab-btn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }

    .card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 16px; margin-bottom: 15px; }
    .script-box { background: #1e293b; border-left: 4px solid #38bdf8; padding: 12px; margin-bottom: 15px; font-size: 14px; color: #cbd5e1; }
    
    .phone-number { font-size: 28px; font-weight: bold; color: #4ade80; text-decoration: none; display: inline-block; margin: 10px 0; }
    
    .btn-group { display: flex; gap: 10px; margin-top: 15px; }
    .btn { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-call { background: #22c55e; color: white; }
    .btn-next { background: #3b82f6; color: white; }
    
    .status-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
    .btn-status { background: #334155; color: white; border: 1px solid #475569; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-status:hover { background: #475569; }
    
    select, textarea, input { width: 100%; background: #0f172a; border: 1px solid #334155; color: white; padding: 10px; border-radius: 6px; margin-top: 5px; }
    
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: #1e293b; padding: 24px; border-radius: 12px; width: 90%; max-width: 420px; }
    
    .appointment-item { background: #0f172a; border: 1px solid #334155; padding: 14px; border-radius: 8px; margin-bottom: 10px; }
    .appointment-date { font-weight: bold; font-size: 14px; margin-bottom: 4px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Unikiq Dialer</h1>
    <div class="seller-badge">Sælger: <strong>Lukas</strong></div>
  </div>

  <div class="card" style="margin-bottom: 15px;">
    <label style="font-size:12px; color:#94a3b8; font-weight:bold;">VALGT KAMPAGNE</label>
    <select id="campaignSelect" onchange="onCampaignChange()"></select>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('dialer')">📞 Ring til Emner</button>
    <button class="tab-btn" onclick="switchTab('appointments')">📅 Aftaler & Opfølgninger</button>
  </div>

  <!-- DIALER TAB -->
  <div id="dialerTab">
    <div class="script-box" id="scriptBox">
      Henter salgsscript...
    </div>

    <div class="card" id="leadCard">
      <h2 id="companyName" style="margin:0; font-size:20px;">Henter lead...</h2>
      <div id="contactPerson" style="color:#94a3b8; font-size:14px; margin-top:4px;"></div>
      <a id="phoneLink" href="#" class="phone-number">...</a>
      
      <div class="btn-group">
        <a id="callBtn" href="#" class="btn btn-call" style="text-align:center; text-decoration:none;">📞 Ring op nu</a>
        <button class="btn btn-next" onclick="loadNextLead()">Næste Lead ➔</button>
      </div>
    </div>

    <div class="card">
      <label style="font-size:12px; color:#94a3b8; font-weight:bold;">OPKALDSNOTER / AFTALE</label>
      <textarea id="callNotes" rows="3" placeholder="Skriv noter fra opkaldet her..."></textarea>
      
      <div class="status-grid">
        <button class="btn-status" onclick="submitResult('Svarede Ikke')">❌ Svarede Ikke</button>
        <button class="btn-status" onclick="submitResult('Ikke Interesseret')">🚫 Ikke Interesseret</button>
        <button class="btn-status" style="border-color:#38bdf8; color:#38bdf8;" onclick="openDateModal('Send Info')">✉️ Send Info / Tilbud</button>
        <button class="btn-status" style="border-color:#eab308; color:#eab308;" onclick="openDateModal('Ring Igen')">📅 Ring Igen</button>
        <button class="btn-status" style="border-color:#22c55e; color:#22c55e; grid-column: span 2;" onclick="openDateModal('Møde Booket')">🎉 Møde Booket</button>
      </div>
    </div>
  </div>

  <!-- APPOINTMENTS TAB -->
  <div id="appointmentsTab" style="display:none;">
    <div class="sub-tabs">
      <button class="sub-tab-btn active" onclick="filterAppointments('all', this)">📋 Alle Aftaler</button>
      <button class="sub-tab-btn" onclick="filterAppointments('moede', this)">🎉 Bookede Møder</button>
      <button class="sub-tab-btn" onclick="filterAppointments('tilbud', this)">✉️ Sendte Tilbud</button>
      <button class="sub-tab-btn" onclick="filterAppointments('ring', this)">📅 Tilbageringninger</button>
    </div>
    
    <div id="appointmentsList">Henter aftaler...</div>
  </div>
</div>

<!-- DATE/TIME & EMAIL MODAL -->
<div class="modal" id="dateModal">
  <div class="modal-content">
    <h3 id="modalTitle" style="margin-top:0;">Vælg dato og tidspunkt</h3>
    
    <label style="font-size:12px; color:#94a3b8; font-weight:bold;">OPFØLGNINGSDATO & TID</label>
    <input type="datetime-local" id="appointmentTime">

    <div id="emailFields" style="display:none; margin-top:12px;">
      <label style="font-size:12px; color:#38bdf8; font-weight:bold;">MODTAGER E-MAIL (KLADDE)</label>
      <input type="email" id="recipientEmail" placeholder="f.eks. kontakt@firma.dk">

      <label style="font-size:12px; color:#94a3b8; font-weight:bold; margin-top:8px; display:block;">KONTAKTPERSON</label>
      <input type="text" id="recipientContact" placeholder="Navn på modtager">
    </div>

    <div class="btn-group" style="margin-top:20px;">
      <button class="btn" style="background:#475569; color:white;" onclick="closeModal()">Annuller</button>
      <button class="btn btn-call" onclick="confirmAppointment()">Gem Aftale</button>
    </div>
  </div>
</div>

<script>
  const WEBHOOK_GET_CAMPAIGNS = 'https://n8n.unikiq.dk/webhook/dialer-get-campaigns';
  const WEBHOOK_GET_LEAD = 'https://n8n.unikiq.dk/webhook/dialer-get-lead';
  const WEBHOOK_SAVE_RESULT = 'https://n8n.unikiq.dk/webhook/dialer-save-result';
  const WEBHOOK_GET_APPOINTMENTS = 'https://n8n.unikiq.dk/webhook/dialer-get-appointments';
  const WEBHOOK_CREATE_DRAFT = 'https://n8n.unikiq.dk/webhook/unikiqsalgsassistent';

  let currentLead = null;
  let selectedStatus = '';
  let allAppointments = [];
  let currentTab = 'dialer';

  async function init() {
    await fetchCampaigns();
    await loadNextLead();
  }

  async function fetchCampaigns() {
    try {
      const res = await fetch(WEBHOOK_GET_CAMPAIGNS);
      const data = await res.json();
      const select = document.getElementById('campaignSelect');
      select.innerHTML = '';
      data.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = `${c.name} (${c.client_name})`;
        select.appendChild(opt);
      });
      updateScript();
    } catch(e) { console.error("Fejl ved hentning af kampagner:", e); }
  }

  function onCampaignChange() {
    updateScript();
    loadNextLead();
    if (currentTab === 'appointments') {
      fetchAppointments();
    }
  }

  function updateScript() {
    const campaignId = document.getElementById('campaignSelect').value;
    const scriptBox = document.getElementById('scriptBox');
    if (campaignId == '2') {
      scriptBox.innerHTML = '<strong>Salgsscript (Komplet Lej):</strong><br>"Hej! Jeg ringer på vegne af Komplet Lej vedrørende jeres materiel og skurvogne..."';
    } else {
      scriptBox.innerHTML = '<strong>Salgsscript (Unikiq):</strong><br>"Hej! Jeg ringer vedrørende jeres salg og mødebooking..."';
    }
  }

  async function loadNextLead() {
    const campaignSelect = document.getElementById('campaignSelect');
    if (!campaignSelect || !campaignSelect.value) return;
    
    const campaignId = campaignSelect.value;
    document.getElementById('companyName').textContent = 'Henter næste emne...';
    document.getElementById('contactPerson').textContent = '';
    document.getElementById('phoneLink').textContent = '...';
    document.getElementById('callNotes').value = '';

    try {
      const res = await fetch(`${WEBHOOK_GET_LEAD}?campaign_id=${campaignId}`);
      const data = await res.json();
      if (data && data.id) {
        currentLead = data;
        document.getElementById('companyName').textContent = data.company_name || 'Ukendt Firma';
        document.getElementById('contactPerson').textContent = data.contact_person ? `Kontakt: ${data.contact_person}` : '';
        document.getElementById('phoneLink').textContent = data.phone || 'Intet nummer';
        document.getElementById('phoneLink').href = `tel:${data.phone}`;
        document.getElementById('callBtn').href = `tel:${data.phone}`;
        if (data.notes) {
          document.getElementById('callNotes').value = data.notes;
        }
      } else {
        currentLead = null;
        document.getElementById('companyName').textContent = '🎉 Ingen flere emner!';
        document.getElementById('phoneLink').textContent = '';
      }
    } catch(e) { 
      console.error("Fejl ved hentning af lead:", e);
      document.getElementById('companyName').textContent = 'Kunne ikke hente emne';
    }
  }

  function openDateModal(status) {
    if (!currentLead) { alert("Intet aktivt lead at gemme for."); return; }
    selectedStatus = status;
    const emailFields = document.getElementById('emailFields');
    emailFields.style.display = 'none';

    if (status === 'Møde Booket') {
      document.getElementById('modalTitle').textContent = '🎉 Vælg mødetidspunkt';
    } else if (status === 'Send Info') {
      document.getElementById('modalTitle').textContent = '✉️ Send Tilbud & Vælg Opfølgning';
      emailFields.style.display = 'block';
      document.getElementById('recipientContact').value = currentLead ? (currentLead.contact_person || '') : '';
    } else {
      document.getElementById('modalTitle').textContent = '📅 Vælg tilbageringningstidspunkt';
    }
    document.getElementById('dateModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('dateModal').style.display = 'none';
  }

  async function confirmAppointment() {
    const datetime = document.getElementById('appointmentTime').value;
    if (!datetime) { alert('Vælg venligst en dato og tid!'); return; }
    
    if (selectedStatus === 'Send Info') {
      const email = document.getElementById('recipientEmail').value;
      const contact = document.getElementById('recipientContact').value;
      if (!email) { alert('Tast venligst modtagerens e-mail!'); return; }

      try {
        fetch(WEBHOOK_CREATE_DRAFT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: email,
            company_name: currentLead ? currentLead.company_name : '',
            contact_person: contact,
            campaign_id: document.getElementById('campaignSelect').value
          })
        });
      } catch(e) { console.error("Kunne ikke oprette kladde:", e); }
    }

    closeModal();
    await submitResult(selectedStatus, datetime);
  }

  async function submitResult(status, dateVal = null) {
    if (!currentLead) return;
    const notes = document.getElementById('callNotes').value;
    
    try {
      await fetch(WEBHOOK_SAVE_RESULT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          lead_id: currentLead.id,
          status: status,
          notes: notes,
          appointment_date: dateVal
        })
      });
    } catch(e) {
      console.error("Fejl ved gemning af resultat:", e);
    }

    // Indlæs næste lead
    await loadNextLead();
  }

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    if (tab === 'dialer') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('dialerTab').style.display = 'block';
      document.getElementById('appointmentsTab').style.display = 'none';
    } else {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('dialerTab').style.display = 'none';
      document.getElementById('appointmentsTab').style.display = 'block';
      fetchAppointments();
    }
  }

  async function fetchAppointments() {
    const campaignSelect = document.getElementById('campaignSelect');
    if (!campaignSelect) return;
    const campaignId = campaignSelect.value;
    const list = document.getElementById('appointmentsList');
    list.innerHTML = '<p style="color:#94a3b8;">Henter aftaler for den valgte kampagne...</p>';
    try {
      const res = await fetch(`${WEBHOOK_GET_APPOINTMENTS}?campaign_id=${campaignId}`);
      allAppointments = await res.json();
      
      const subTabBtns = document.querySelectorAll('.sub-tab-btn');
      subTabBtns.forEach(b => b.classList.remove('active'));
      if(subTabBtns[0]) subTabBtns[0].classList.add('active');

      renderAppointments(allAppointments);
    } catch(e) { list.innerHTML = '<p style="color:#ef4444;">Kunne ikke hente aftaler.</p>'; }
  }

  function filterAppointments(type, btn) {
    document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    if (type === 'moede') {
      renderAppointments(allAppointments.filter(a => a.status === 'Møde Booket'));
    } else if (type === 'tilbud') {
      renderAppointments(allAppointments.filter(a => a.status === 'Send Info' || a.status === 'Sendt tilbud'));
    } else if (type === 'ring') {
      renderAppointments(allAppointments.filter(a => a.status === 'Ring Igen'));
    } else {
      renderAppointments(allAppointments);
    }
  }

  function renderAppointments(items) {
    const list = document.getElementById('appointmentsList');
    if (!items || items.length === 0) {
      list.innerHTML = '<p style="color:#94a3b8;">Ingen emner i denne kategori for den valgte kampagne.</p>';
      return;
    }
    list.innerHTML = '';
    items.forEach(item => {
      const rawTime = item.booked_for || item.callback_at;
      let formattedDate = 'Ingen dato angivet';
      if (rawTime) {
        const d = new Date(rawTime);
        if (!isNaN(d.getTime())) {
          formattedDate = d.toLocaleString('da-DK', { dateStyle: 'short', timeStyle: 'short' });
        } else {
          formattedDate = rawTime;
        }
      }

      let tagText = '📅 RING IGEN';
      let tagColor = '#eab308';

      if (item.status === 'Møde Booket') {
        tagText = '🎉 MØDE';
        tagColor = '#22c55e';
      } else if (item.status === 'Send Info' || item.status === 'Sendt tilbud') {
        tagText = '✉️ TILBUD / OPFØLGNING';
        tagColor = '#38bdf8';
      }

      const div = document.createElement('div');
      div.className = 'appointment-item';
      div.innerHTML = `
        <div class="appointment-date" style="color:${tagColor};">${tagText}: ${formattedDate}</div>
        <strong style="font-size:16px;">${item.company_name}</strong> ${item.contact_person ? '(' + item.contact_person + ')' : ''}<br>
        <span style="color:#4ade80;">📞 ${item.phone}</span><br>
        <small style="color:#cbd5e1;">Noter: ${item.notes || 'Ingen noter'}</small>
      `;
      list.appendChild(div);
    });
  }

  init();
</script>
</body>
</html>
